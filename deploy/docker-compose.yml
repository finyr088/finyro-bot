# Продакшн-стек для VPS: приложение Финуро + Caddy (HTTPS-прокси).
# Запуск: docker compose --env-file ../.env -f deploy/docker-compose.yml up -d --build
# (или используйте deploy/setup.sh — он всё сделает сам)
name: finyro

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: ../.env
    environment:
      # База и загруженные видео хранятся в томе — переживают пересборки/перезапуски.
      DATABASE_URL: sqlite+aiosqlite:////data/finyro.db
      MEDIA_DIR: /data/media
    volumes:
      - appdata:/data
    expose:
      - "8080"
    # Прибиваем api.telegram.org к рабочему IP: в этом ДЦ домен резолвится в
    # несколько адресов, часть из которых режется — из-за чего бот виснет.
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    # DOMAIN берём напрямую из .env (надёжно, не зависит от флага --env-file в команде).
    env_file: ../.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    restart: unless-stopped

volumes:
  appdata:
  caddydata:
  caddyconfig:
